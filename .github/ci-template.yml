# GitHub Actions CI Workflow Template
# Move this file to .github/workflows/ci.yml once your Personal Access Token has the 'workflow' scope enabled.
name: CI & Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter and type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build
